<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <script type="module" src="js/index.js"></script>
    <link rel="icon" href="https://hexagonmath.org/favicon-192.png" type="image/png" sizes="192x192">
    <title>Battlemap</title>
  </head>
  <!-- LINK TO THE ARTICLE THAT HELPED ME MAKE THE HEXAGON GRID: https://css-tricks.com/hexagons-and-beyond-flexible-responsive-grid-patterns-sans-media-queries/ -->
  <body>
    <main class="battlemap">
      <img src="assets/bandit_camp_battlemap.jpg" class="background-image">
      <div class="grid"></div>
    </main>
    <div class="initiative-btn inactive">
      <i class="fa-solid fa-angle-up initiative-btn-icon"></i>
    </div>
    <section class="initiative-menu inactive">
      <div class="smaller-btn">
        <i class="fa-regular fa-eye smaller-btn-icon"></i>
      </div>
      <div class="sort-btn">
        <i class="fa-solid fa-arrow-down-wide-short"></i>
      </div>
    </section>
    <div class="characters-btn inactive">
      <i class="fa-solid fa-angle-left characters-btn-icon"></i>
    </div>
    <section class="characters-menu inactive">
      <div class="character-card" id="parryhotter">
        <img draggable="false" src="assets/character-images/parry-hotter.png" alt="player 1 card" class="character-img">
        <p class="character-title">Parry Hotter</p>
      </div>
      <div class="character-card" id="indianastones">
        <img draggable="false" src="assets/character-images/indiana-stones.png" alt="player 2 card" class="character-img">
        <p class="character-title">Indiana Stones</p>
      </div>
      <div class="character-card" id="vuffi">
        <img draggable="false" src="assets/character-images/vuffi-regular.png" alt="player 3 card" class="character-img">
        <p class="character-title">Vuffi</p>
      </div>
      <div class="character-card" id="peber">
        <img draggable="false" src="assets/character-images/peber-horse.png" alt="mount card" class="character-img">
        <p class="character-title">Peber</p>
      </div>
      <div class="character-card" id="commoner">
        <img draggable="false" src="assets/character-images/human-commoner.png" alt="commoner card" class="character-img">
        <p class="character-title">Friendly NPC</p>
      </div>
      <section class="cards-subsection">
        <div class="subsection-container">
          <div class="character-card subsection-card" id="humanoid">
            <img draggable="false" src="assets/character-images/bandit-humanoid.png" alt="humanoid card" class="character-img subsection-img top-left">
            <p class="character-title subtitle">Humanoid</p>
          </div>
          <div class="character-card subsection-card" id="humanoid">
            <img draggable="false" src="assets/character-images/goblin-humanoid.png" alt="humanoid card" class="character-img subsection-img top-right">
            <p class="character-title subtitle">Goblin</p>
          </div>
          <div class="character-card subsection-card" id="humanoid">
            <img draggable="false" src="assets/character-images/shaman-humanoid.png" alt="humanoid card" class="character-img subsection-img bottom-left">
            <p class="character-title subtitle">Goblin Shaman</p>
          </div>
          <div class="character-card subsection-card" id="humanoid">
            <img draggable="false" src="assets/character-images/warlock-humanoid.png" alt="humanoid card" class="character-img subsection-img bottom-right">
            <p class="character-title subtitle">Spellcaster</p>
          </div>
        </div>
        <p class="character-title">Humanoid</p>
      </section>
      <div class="character-card" id="beast">
        <img draggable="false" src="assets/character-images/wolf-beast.png" alt="beast card" class="character-img">
        <p class="character-title">Beast</p>
      </div>
      <div class="character-card" id="horse">
        <img draggable="false" src="assets/character-images/riding-horse.png" alt="horse card" class="character-img">
        <p class="character-title">Horse</p>
      </div>
      <div class="character-card" id="construct">
        <img draggable="false" src="assets/character-images/armor-construct.png" alt="construct card" class="character-img">
        <p class="character-title">Construct</p>
      </div>

      <div class="character-card" id="fiend">
        <img draggable="false" src="assets/character-images/devil-fiend.png" alt="fiend card" class="character-img">
        <p class="character-title">Fiend</p>
      </div>
      <div class="character-card" id="fey">
        <img draggable="false" src="assets/character-images/hag-fey.png" alt="fey card" class="character-img">
        <p class="character-title">Fey</p>
      </div>
      <div class="character-card" id="monstrosity">
        <img draggable="false" src="assets/character-images/chimera-monstrosity.png" alt="monstrosity card" class="character-img">
        <p class="character-title">Monstrosity</p>
      </div>
      <div class="character-card" id="undead">
        <img draggable="false" src="assets/character-images/vampirespawn-undead.png" alt="undead card" class="character-img">
        <p class="character-title">Undead</p>
      </div>
      <div class="character-card" id="dragon">
        <img draggable="false" src="assets/character-images/silver-dragon.png" alt="dragon card" class="character-img">
        <p class="character-title">Dragon</p>
      </div>
      <div class="character-card" id="aberration">
        <img draggable="false" src="assets/character-images/mindflayer-aberration.png" alt="aberration card" class="character-img">
        <p class="character-title">Aberration</p>
      </div>
      <div class="character-card" id="elemental">
        <img draggable="false" src="assets/character-images/water-elemental.png" alt="elemental card" class="character-img">
        <p class="character-title">Elemental</p>
      </div>
      <div class="character-card" id="plant">
        <img draggable="false" src="assets/character-images/bulbous-plant.png" alt="plant card" class="character-img">
        <p class="character-title">Plant Creature</p>
      </div>
      <div class="character-card" id="ooze">
        <img draggable="false" src="assets/character-images/cauldron-ooze.png" alt="ooze card" class="character-img">
        <p class="character-title">Ooze</p>
      </div>
      <div class="character-card" id="giant">
        <img draggable="false" src="assets/character-images/hill-giant.png" alt="giant card" class="character-img">
        <p class="character-title">Giant</p>
      </div>
      <div class="character-card" id="celestial">
        <img draggable="false" src="assets/character-images/deva-celestial.png" alt="celestial card" class="character-img">
        <p class="character-title">Celestial</p>
      </div>
      <div class="character-card" id="boss">
        <img draggable="false" src="assets/character-images/skull-boss.png" alt="boss card" class="character-img">
        <p class="character-title">Boss/Miniboss</p>
      </div>
    </section>
  </body>
</html>
